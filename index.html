<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6D2E5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Perfume">
<title>Perfume</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#F7F5F2; --card:#FFFFFF; --ink:#1C1917; --muted:#6B635A; --line:#E7E2DA; --line2:#EFEBE5;
  --plum:#6D2E5B; --plum-dark:#4E1F41; --plum-soft:#F3E8EF; --green:#2F6B3A; --amber-bg:#FFF1DC; --amber:#8A4B05; --red:#A3261C;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
body{padding-top:var(--safe-t)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.2px}
h1{font-size:27px} h2{font-size:17px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--plum);text-decoration:none}
.page{padding:18px 18px calc(110px + var(--safe-b));display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.page.full{padding-bottom:calc(30px + var(--safe-b))}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:14px 16px}
.list>*{padding:12px 16px;border-bottom:1px solid var(--line2)} .list>*:last-child{border-bottom:0}
.hero{background:var(--plum);color:#fff;border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.hero .big{font-size:34px;font-weight:650;letter-spacing:-.5px}
.hero .sub{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.quick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;font-size:12px;font-weight:500;color:var(--ink);text-align:center}
.btn{min-height:48px;border-radius:14px;border:0;background:var(--plum);color:#fff;font-weight:600;font-size:16px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}
.btn:active{background:var(--plum-dark)}
.btn.ghost{background:#fff;color:var(--plum);border:2px solid var(--plum)}
.btn.plain{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:15px}
.btn.small{min-height:40px;font-size:14px;width:auto}
.btn.danger{background:#fff;color:var(--red);border:1px solid #E8C5C1}
.btn[disabled]{opacity:.45}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.low{background:var(--amber-bg);color:var(--amber)} .pill.out{background:#FBE4E1;color:var(--red)} .pill.plum{background:var(--plum-soft);color:var(--plum)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
.in{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:16px;color:var(--ink);width:100%}
textarea.in{padding:10px 12px;min-height:70px}
.sz{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--bg);border-radius:10px;padding:6px 0}
.sz b{font-size:15px} .sz span{font-size:11px;color:var(--muted)}
.sz.low{background:var(--amber-bg)} .sz.low b{color:var(--amber)} .sz.out{background:#FBE4E1} .sz.out b{color:var(--red)}
.qty{width:100%;min-height:42px;text-align:center;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding:8px 0 calc(8px + var(--safe-b));z-index:10}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);min-width:58px;min-height:44px}
.tab.on{color:var(--plum)}
.tab.scan{width:60px;height:60px;margin-top:-26px;border-radius:30px;background:var(--plum);justify-content:center;box-shadow:0 6px 16px rgba(109,46,91,.35);min-width:0}
.cam{position:relative;background:#1C1917;border-radius:20px;overflow:hidden;aspect-ratio:4/3.4}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:18% 22%;border:3px solid rgba(255,255,255,.9);border-radius:18px}
.cam .msg{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.toast{position:fixed;left:50%;bottom:calc(104px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.err{background:var(--red)}
.sheet-bg{position:fixed;inset:0;background:rgba(28,25,23,.45);z-index:40;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 18px calc(22px + var(--safe-b));display:flex;flex-direction:column;gap:12px}
.thumb{width:64px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#ECE7E0;border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:38px;border:0;border-radius:9px;background:transparent;font-weight:500;font-size:14px;color:#57504A}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
